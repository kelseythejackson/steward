name: Steward Review
description: "Comments on off-system colors, spacing and components, and on accessibility basics, in the lines a pull request changes, with one-click fixes."
author: Steward
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: "The folder that holds .steward/system.json, relative to the repo root."
    required: false
    default: "."
  github-token:
    description: "Token used to post comments. Needs `pull-requests: write`."
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # Steward isn't published yet, so the action builds it from its own source
    # (only the CLI and the packages it uses). If that fails, nothing was checked:
    # warn mode warns and passes; error mode ("mode": "error" in the app's
    # .steward/config.json) fails the check, since it can't call the change clean.
    - name: Build Steward
      id: build
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        STEWARD_PATH: ${{ inputs.path }}
      run: |
        if npx --yes pnpm@12.18.0 install --frozen-lockfile --filter @steward/cli... && npx --yes pnpm@12.18.0 build; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "ok=false" >> "$GITHUB_OUTPUT"
        # Read the mode from the workspace; a missing or unreadable config.json means the default, warn.
        mode="$(node -e '
          const fs = require("fs"), path = require("path");
          try {
            const file = path.join(process.env.GITHUB_WORKSPACE || ".", process.env.STEWARD_PATH || ".", ".steward", "config.json");
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            process.stdout.write(config && config.mode === "error" ? "error" : "warn");
          } catch {
            process.stdout.write("warn");
          }
        ' || echo warn)"
        if [ "$mode" = "error" ]; then
          echo "::error title=Steward Review::Steward couldn't be installed or built, so nothing was checked. Mode: error, so this fails the check."
          exit 1
        fi
        echo "::warning title=Steward Review::Steward couldn't be installed or built, so nothing was checked. Mode: warn, so this doesn't fail the check."

    # Inputs go through env, never straight into the script.
    - name: Steward Review
      if: steps.build.outputs.ok == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        STEWARD_PATH: ${{ inputs.path }}
        STEWARD_BIN: ${{ github.action_path }}/packages/cli/dist/bin.js
      run: node "$STEWARD_BIN" check "$STEWARD_PATH" --github

    # One small file per run: this check's history record (counts and source type only).
    # The runner is thrown away, so Report collects these artifacts later. Never fails the check.
    - name: Save Steward history
      if: always() && steps.build.outputs.ok == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: steward-history-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/steward-history/record.jsonl
        retention-days: 90
        if-no-files-found: ignore
